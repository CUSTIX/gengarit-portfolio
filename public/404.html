<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#05070c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>404 — CUSTIX</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        display: grid; place-items: center; padding: 24px; text-align: center;
        background: #05070c; color: #e8ecf4; font-family: "Sora", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
        background-image:
          radial-gradient(700px circle at 20% 10%, rgba(37,99,235,0.18), transparent 62%),
          radial-gradient(600px circle at 85% 90%, rgba(56,189,248,0.12), transparent 60%),
          linear-gradient(to right, rgba(148,163,184,0.045) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(148,163,184,0.045) 1px, transparent 1px);
        background-size: auto, auto, 96px 96px, 96px 96px;
      }
      .mark { width: 120px; height: 84px; filter: drop-shadow(0 20px 50px rgba(37,99,235,0.5)); animation: drift 7s ease-in-out infinite; }
      @keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      .code { margin-top: 28px; font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0.3em; color: #38bdf8; }
      h1 { margin-top: 14px; font-size: clamp(30px, 5vw, 48px); font-weight: 800; letter-spacing: -0.03em; color: #f2f5fa; }
      p { margin: 14px auto 0; max-width: 42ch; font-size: 15px; line-height: 1.7; color: #98a3b6; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }
      a { text-decoration: none; }
      .primary {
        display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: 999px; color: #fff; font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
        background: linear-gradient(120deg, #2563eb, #38bdf8); box-shadow: 0 14px 40px -12px rgba(37,99,235,0.8); transition: transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s;
      }
      .primary:hover { transform: translateY(-2px); box-shadow: 0 18px 50px -12px rgba(56,189,248,0.9); }
      .ghost {
        display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: 999px; border: 1px solid rgba(148,163,184,0.2); color: #cbd5e1; font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
        transition: border-color .3s, background .3s, color .3s;
      }
      .ghost:hover { border-color: rgba(96,165,250,0.5); background: rgba(37,99,235,0.1); color: #fff; }
      .hint { margin-top: 34px; font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.22em; color: #4d596d; }
      @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 200 140" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="95" y1="30" x2="176" y2="110" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7dd3fc" /><stop offset="0.5" stop-color="#2f80f5" /><stop offset="1" stop-color="#1d3fd0" />
          </linearGradient>
        </defs>
        <path d="M 88.9 43.1 A 38 38 0 1 0 88.9 96.9" stroke="#ffffff" stroke-width="25" />
        <path d="M 96 33 L 172 107" stroke="url(#g)" stroke-width="23" />
        <path d="M 172 33 L 96 107" stroke="url(#g)" stroke-width="23" />
      </svg>
      <div class="code">ERROR 404 · ROUTE NOT FOUND</div>
      <h1>This sector doesn't exist.</h1>
      <p>The page you're looking for was moved, renamed, or never deployed. Everything lives on the single-page portfolio — head back and use ⌘K to jump anywhere.</p>
      <div class="actions">
        <a class="primary" href="/">Back to CUSTIX ↗</a>
        <a class="ghost" href="/#work">See engineered works</a>
        <a class="ghost" href="/#contact">Get in touch</a>
      </div>
      <div class="hint">CUSTIX · JOHN ERIC G. BAYER</div>
    </main>
  </body>
</html>
